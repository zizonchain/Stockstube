name: collect reddit
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.27.2
      - name: restore partial windows
        uses: actions/cache/restore@v4
        with:
          path: data/raw/reddit
          key: reddit-raw-${{ github.run_id }}
          restore-keys: reddit-raw-
      - name: collect (stops itself before the job limit)
        run: |
          timeout 20m python3 -I scripts/collect_reddit3.py posts investing Bogleheads || true
          timeout 300m python3 -I scripts/collect_reddit3.py comments econmonitor SecurityAnalysis quant finance ValueInvesting dividends Bogleheads StockMarket financialindependence investing stocks || true
      - name: compact
        if: always()
        run: python3 -I scripts/compact_reddit.py
      - name: save partial windows
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/reddit
          key: reddit-raw-${{ github.run_id }}
      - name: commit extract
        if: always()
        run: |
          git config user.name "stockstube-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/reddit_extract
          git diff --cached --quiet || git commit -m "chore(data): reddit extract update from scheduled collection"
          git pull --rebase origin master && git push origin HEAD:master
